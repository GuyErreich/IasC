# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

output: prefixed

vars:
  LAMBDA_FUNCTION_DIR: 'Lambda_Functions'
  LAMBDA_LAYER_DIR: '{{.LAMBDA_FUNCTION_DIR}}/layer'
  LAMBDA_LAYER_REQUIREMENTS: '{{.LAMBDA_FUNCTION_DIR}}/requirements.txt'
  LAMBDA_ZIP_DIR: '{{.LAMBDA_FUNCTION_DIR}}/zips'
  LAMBDA_FUNCTION_ZIP_NAME: 'functions'
  LAMBDA_LAYER_ZIP_NAME: 'layer'
  LAMBDA_FUNCTION_ZIP_PATH: '{{.LAMBDA_ZIP_DIR}}/{{.LAMBDA_FUNCTION_ZIP_NAME}}.zip'
  LAMBDA_LAYER_ZIP_PATH: '{{.LAMBDA_ZIP_DIR}}/{{.LAMBDA_LAYER_ZIP_NAME}}.zip'
  PLAN_FILE: 'aws_fargate.tfplan'

tasks:
  init:
    desc: Initialize Terraform (including plugin installation)
    cmds: 
      - terraform init -upgrade {{.CLI_ARGS}}

  validate:
    desc: Validate Terraform configuration
    cmds: 
      - terraform validate {{.CLI_ARGS}}

  plan:
    desc: Generate and review Terraform plan
    deps:
      - zip_lambda_function
      - zip_lambda_layer
    cmds:
      - terraform plan {{.CLI_ARGS}} -out={{.PLAN_FILE}} -var="lambda_layer_zip={{.LAMBDA_LAYER_ZIP_PATH}}" -var="lambda_zip={{.LAMBDA_FUNCTION_ZIP_PATH}}"

  apply:
    desc: Apply Terraform plan if it exists
    preconditions:
      - sh: test -f "{{.PLAN_FILE}}"
        msg: "Plan file '{{.PLAN_FILE}}' not found. Run 'task plan' first."
    prompt: Please make sure to go over the plan logs before continuing!
    cmds:
      - terraform apply {{.PLAN_FILE}} {{.CLI_ARGS}}
    sources:
      - '{{.PLAN_FILE}}'

  zip_lambda_function:
    desc: Package Lambda function code into a zip file
    internal: true
    cmds:
      - |
        echo "Zipping Lambda function code..."
        mkdir -p {{.LAMBDA_ZIP_DIR}}  # Ensure the zip directory exists
        rm -f {{.LAMBDA_FUNCTION_ZIP_PATH}} | true
        cd {{.LAMBDA_FUNCTION_DIR}}
        zip -r ../{{.LAMBDA_FUNCTION_ZIP_PATH}} *.py
    sources:
     - '{{.LAMBDA_FUNCTION_DIR}}/*.py'
    generates:
      - '{{.LAMBDA_FUNCTION_ZIP_PATH}}'

  zip_lambda_layer:
    desc: Package Lambda layer dependencies into a zip file
    internal: true
    cmds:
      - |
        echo "Installing dependencies for Lambda layer..."
        pip install -r {{.LAMBDA_LAYER_REQUIREMENTS}} -t {{.LAMBDA_LAYER_DIR}}/python --upgrade
        echo "Zipping Lambda layer..."
        mkdir -p {{.LAMBDA_ZIP_DIR}}  # Ensure the zip directory exists
        rm -f {{.LAMBDA_LAYER_ZIP_PATH}} | true
        cd {{.LAMBDA_LAYER_DIR}}
        zip -r ../../{{.LAMBDA_LAYER_ZIP_PATH}} python
    sources:
     - '{{.LAMBDA_LAYER_REQUIREMENTS}}'
    generates:
      - '{{.LAMBDA_LAYER_ZIP_PATH}}'